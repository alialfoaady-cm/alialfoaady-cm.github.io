<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Returning to Clip Review Tool</title>
</head>
<body>
<p>Returning to the Clip Review Tool on your computer...</p>
<p id="fallback" hidden>If nothing happens, make sure the tool is running on this computer, then
<a id="link" href="#">click here</a>.</p>
<script>
var target = "http://localhost:8080/callback" + window.location.search;
document.getElementById("link").href = target;
setTimeout(function () { document.getElementById("fallback").hidden = false; }, 3000);
window.location.replace(target);
</script>
</body>
</html>
